; PlatformIO build for the Cardputer-ADV + Cap CC1101 variant.
; The ESP-IDF build (winbuild.py / build.sh) stays the reference path; this file
; exists so the same CMake project can be driven by PlatformIO's espidf builder.

[platformio]
default_envs = cardputer_adv_cap

[env:cardputer_adv_cap]
platform = espressif32
board = m5stack-cardputer
framework = espidf
; Cardputer-ADV has 8 MB flash; the board definition above says 4 MB.
board_build.flash_size = 8MB
; FLIPPER_BOARD selects the board header and filters board-incompatible apps
; (fam_config.py). The sdkconfig layering is set in tools/pio_env.py.
board_build.cmake_extra_args =
  -DFLIPPER_BOARD=m5stack_cardputer_adv_cap
extra_scripts = pre:tools/pio_env.py
